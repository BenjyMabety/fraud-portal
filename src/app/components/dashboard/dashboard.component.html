<div class="dashboard-container">
  <!-- Navbar -->
  <nav class="navbar">
    <h1>Fraud Admin Portal</h1>
    <div class="user-info" *ngIf="currentUser">
      <span>Welcome, {{ currentUser.userName }}</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </nav>

  <!-- Action Buttons -->
  <div class="container">
    <div class="action-buttons">
      <button class="generate-btn" (click)="generateSample()">📥 Generate Sample File</button>
      <button class="btn btn-refresh" (click)="refreshFiles()" title="Refresh data" style="margin-top: 25px;">
      🔄 Refresh Files
    </button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button
        class="tab-button"
        [class.active]="activeTab === 'files'"
        (click)="switchTab('files')"
      >
        📁 Processed Files
      </button>
      <button
        class="tab-button"
        [class.active]="activeTab === 'alerts'"
        (click)="switchTab('alerts')"
      >
        🚨 Fraud Alerts
      </button>
      <button
        class="tab-button"
        [class.active]="activeTab === 'rules'"
        (click)="switchTab('rules')"
      >
        ⚙️ Fraud Rules
      </button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">
      <app-processed-files *ngIf="activeTab === 'files'"></app-processed-files>
      <app-fraud-alerts *ngIf="activeTab === 'alerts'"></app-fraud-alerts>
      <app-fraud-rules *ngIf="activeTab === 'rules'"></app-fraud-rules>
    </div>
  </div>
</div>
